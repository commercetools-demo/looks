fragment PieceVariantFragment on ProductVariant {
  sku
  images {
    url
  }
  prices {
    value {
      currencyCode
      centAmount
    }
    country
    validFrom
    validUntil
    customerGroupRef {
      id
    }
    channelRef {
      id
    }
  }
  attributesRaw {
    name
    value
  }
  availability {
    noChannel {
      availableQuantity
    }
  }
}

fragment PieceProductFragment on Product {
  id
  masterData {
    current {
      name(acceptLanguage: $acceptLanguage)
      masterVariant {
        ...PieceVariantFragment
      }
      variants {
        ...PieceVariantFragment
      }
    }
  }
}
